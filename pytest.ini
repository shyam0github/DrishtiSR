[pytest]
# Collect ONLY the repository's own tests.
#
# Without this, `pytest` from the repository root also walks outputs/, and
# `scripts/kaggle_run.py fetch` / `logs` download a Kaggle run's /kaggle/working
# tree -- which contains a full clone of this repo, tests included. Collection
# then finds two copies of every test module, fails on the duplicate basenames,
# and reports 12 collection errors that look like the test suite is broken when
# nothing is wrong with it. MEASURED on 2026-09-06, immediately after the first
# real `logs` call.
testpaths = tests

# Belt and braces: never descend into downloaded or generated trees even if
# someone runs pytest with an explicit path above them.
norecursedirs = outputs .venv* .git __pycache__ .pytest_cache

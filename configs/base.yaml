# DrishtiSR base configuration (OmegaConf).
#
# Every script reads its settings from here or from a config that merges on top of it.
# NOTHING in src/ or scripts/ may hardcode a filesystem path, a band name, or a scale
# factor. If you need a new constant, it goes in this file.
#
# Load with:
#     from omegaconf import OmegaConf
#     cfg = OmegaConf.load("configs/base.yaml")

project:
  name: DrishtiSR
  problem_statement: SIH26142
  description: Deep-learning super-resolution of Sentinel-2 imagery, 10 m -> 2.5 m (x4).

seed: 42

paths:
  # Explicit override. Leave null in version control. If set, it wins over both
  # candidates below and must exist (see src/utils/paths.resolve_data_root).
  data_root: null

  # Candidate roots, tried in this order by resolve_data_root().
  # Kaggle mounts competition/dataset inputs read-only under /kaggle/input.
  kaggle_data_root: /kaggle/input

  # THE UPLOADED CACHE, mounted on Kaggle. A Kaggle Dataset attached to a
  # notebook appears at {kaggle_mount_root}/{kaggle_dataset_dir} -- note the
  # mount path uses the dataset NAME only, with no owner prefix, even though the
  # API slug is "<username>/<name>".
  #
  # These two keys are what make resolve_data_root() and resolve_cache_dir()
  # find the ~3000 pre-downloaded SEN2NAIPv2 pairs instead of re-fetching them
  # over 8 hours of notebook time. Built and pushed by scripts/kaggle_upload.py.
  #
  # WHY THIS IS NOT JUST kaggle_data_root=/kaggle/input: that directory EXISTS
  # on every Kaggle notebook, attached dataset or not. Resolving to it would let
  # a training run start against an empty tree and report zero samples as though
  # that were a valid result. The resolver therefore composes the full mount
  # path including the dataset name, and REJECTS it when it is missing or empty.
  kaggle_mount_root: /kaggle/input
  # MUST equal kaggle.dataset_slug below. tests/test_kaggle_upload.py asserts it:
  # if they drift, the upload lands at one path and the resolver looks at
  # another, and the only symptom is an empty dataset.
  kaggle_dataset_dir: drishtisr-sen2naipv2-cache

  # WHERE THE MOUNT ACTUALLY APPEARS. There is more than one layout, and this
  # project had the wrong one.
  #
  # MEASURED on Kaggle 2026-09-06, by listing /kaggle/input from inside a run:
  # a dataset attached through kernel-metadata.json's dataset_sources appears at
  #     /kaggle/input/datasets/<owner>/<slug>
  # WITH the owner segment -- not at /kaggle/input/<slug>, which is the layout
  # this file and src/utils/paths.py both asserted. Every run therefore resolved
  # no data, and on a GPU job that is an hour of the weekly budget.
  #
  # Both layouts are tried, in this order, by kaggle_mount_candidates(). The
  # owner is a glob rather than a username so nothing here has to change for a
  # different Kaggle account, and no username enters version control.
  kaggle_mount_patterns:
    - "{root}/datasets/*/{name}"
    - "{root}/{name}"
  # Local Windows mirror of the same tree. Forward slashes are intentional:
  # pathlib handles them correctly on Windows and they survive YAML unescaped.
  local_data_root: D:/SIH/DrishtiSR/data

  # Written artefacts. Relative paths resolve against the repository root, which
  # keeps the repo identical on D: and under /kaggle/working.
  output_root: outputs
  # Sample cache. On Kaggle this should be /kaggle/temp: it is large, fast, and
  # NOT counted against the 20 GB /kaggle/working output quota. Resolved by
  # src/utils/paths.resolve_cache_dir, which prefers kaggle_cache_dir when the
  # Kaggle filesystem is present.
  cache_dir: outputs/cache
  kaggle_cache_dir: /kaggle/temp/drishtisr_cache
  checkpoint_dir: outputs/checkpoints
  figure_dir: outputs/figures
  metric_dir: outputs/metrics
  manifest_dir: outputs
  log_file: outputs/run.log
  # Progress log for the real Kaggle upload, written with timestamps so it can
  # be tailed from a second window while a multi-hour transfer runs unattended:
  #   Get-Content -Path outputs/upload.log -Wait -Tail 20
  upload_log: outputs/upload.log

dataset:
  # Key into src/data/registry.py. Switching datasets is a change to THIS LINE
  # plus the matching block below -- never a change to training code.
  name: sen2naipv2

  # Band names in channel order. Order is load-bearing: it fixes the channel axis
  # for every tensor in the project.
  # VERIFIED against record NA5120_E1183N0757__m_3912321_nw_10_060_20220710:
  # SEN2NAIPv2 stores RGBN, i.e. red first, NIR last. Listing these as
  # [B02, B03, B04, B08] would silently transpose red and blue.
  bands: [B04, B03, B02, B08]

  # reflectance = digital_number / reflectance_scale
  # VERIFIED, not taken from the dataset card. The card's "/ 3000" is a display
  # stretch for RGB rendering. Measured band means on a Mendocino forest record
  # were R=578.7 G=565.5 B=343.5 NIR=2486.3; dividing by 10000 gives
  # R=0.058 G=0.057 B=0.034 NIR=0.249, which is textbook vegetation surface
  # reflectance. Dividing by 3000 would put a forest at 0.83 NIR -- impossible.
  # 10000 is also the standard Sentinel-2 L2A quantification value.
  reflectance_scale: 10000.0

  # Nominal physical range of surface reflectance. Bright targets (cloud, snow,
  # specular water, some urban roofs) legitimately exceed 1.0.
  # DO NOT clip to this range silently -- the spectral-consistency objective needs
  # the true radiometry end to end. Used for assertions and reporting only.
  reflectance_nominal_min: 0.0
  reflectance_nominal_max: 1.0
  # Upper bound enforced by SRPairDataset.validate_sample(). This is a guard
  # against DECODING faults, not a radiometric limit -- it must never be reached
  # by clipping.
  #
  # RAISED FROM 1.2 TO 2.0, MEASURED over 1322 cached crosssensor tiles at the
  # full 128 px tile size (the old 64 px centre crop simply never contained these
  # pixels, which is why 1.2 held before):
  #   - 4 tiles of 1322 (0.3%) exceed 1.2 reflectance; the largest is 1.685.
  #   - The excess is 1-20 pixels per tile, in small contiguous blobs, bright in
  #     ALL FOUR bands at once (e.g. 1.62 / 1.685 / 1.669 / 1.30 against a tile
  #     mean of 0.15). Spectrally flat and extremely bright across VIS+NIR is the
  #     signature of cloud or a specular roof -- real signal, not corruption.
  #   - Per-band max DIGITAL NUMBERS agree exactly between LR and HR on those
  #     tiles (16200/16848/16688/13000), i.e. both sources carry the same bright
  #     target rather than one having been mis-scaled.
  #   - Nothing exceeds 2.0. Nothing approaches 6.5535, which is what an unmasked
  #     nodata pixel (65535/10000) would produce, and nothing sits near the ~3.3x
  #     inflation a /3000 divisor would cause.
  # So 2.0 still catches both failure modes the check exists for while admitting
  # the bright tail the spectral-consistency objective must reproduce. Do NOT
  # respond to a future breach by clipping -- measure it the same way first.
  reflectance_valid_max: 2.0

  # Sentinel value for "no valid observation", in RAW digital numbers.
  # VERIFIED: both LR and HR GeoTIFFs declare nodata=65535. This MUST be masked
  # before scaling -- 65535/10000 = 6.55 reflectance would trip validation on
  # every tile containing a nodata pixel.
  nodata_value: 65535
  # What to write where a pixel is nodata, in reflectance units, after masking.
  nodata_fill: 0.0
  # Reject a sample whose nodata fraction exceeds this (0.0-1.0).
  #
  # A pixel counts as nodata when ANY selected band equals nodata_value there,
  # and the fraction is measured over the FULL stored tile (130x130 LR,
  # 520x520 HR), not over a centre crop -- nodata sits at tile edges, which is
  # exactly what a centre crop hides.
  #
  # LOWERED FROM 0.05 TO 0.02. A 5% nodata tile is 845 dead LR pixels; filled
  # with nodata_fill they read as a large black patch of perfectly flat
  # "reflectance", which the spectral-consistency term will happily learn to
  # reproduce. The index reports the loss this threshold causes rather than
  # applying it silently -- see the summary block from scripts/prepare_data.py.
  max_nodata_fraction: 0.02

  # Reporting-only reflectance threshold for the index summary block. Samples
  # exceeding it are listed by name. This is NOT a validation limit (that is
  # reflectance_valid_max) and NOTHING is clipped to it -- it is the tripwire
  # for a wrong reflectance_scale, since a divisor that is too small inflates
  # every tile at once.
  reflectance_report_threshold: 1.2
  # If more than this FRACTION of indexed samples exceed the threshold above,
  # the index says the divisor is suspect rather than just printing a count.
  # A genuine bright tail (cloud, snow, specular roofs) is a few percent; a
  # wrong divisor moves the whole archive.
  divisor_suspect_fraction: 0.05

  # Ground sample distance in metres, before and after super-resolution.
  lr_gsd_m: 10.0
  hr_gsd_m: 2.5

# Per-dataset settings. The active one is chosen by dataset.name above.
# Adding a dataset means adding a block here plus a @register_dataset class --
# it must never require touching training code.
sen2naipv2:
  # VERIFIED present in the tacoreader registry: sen2naipv2-unet,
  # sen2naipv2-histmatch, sen2naipv2-crosssensor. "sen2naipv2-temporal" is
  # advertised on the dataset card but does NOT resolve -- do not use it.
  #
  # crosssensor is the default: 8000 pairs of REAL Sentinel-2 LR (unet and
  # histmatch use synthetic LR), and it is a single .taco file rather than a
  # multipart set, which makes caching simpler and resumption cheaper.
  subset: sen2naipv2-crosssensor
  num_samples: 3000

  # Filter on the per-pair LR/HR correlation carried in the taco metadata.
  # MEASURED over all 8000 crosssensor rows: min=0.866, p05=0.869, median=0.904,
  # max=0.983. So a 0.8 threshold is a no-op that only looks like a quality
  # filter. 0.9 is the first value that actually bites: it keeps 4409 rows,
  # still comfortably above num_samples. null disables the filter.
  min_correlation: 0.9

  # Restrict to a tortilla:data_split value, or null for all splits.
  # MEASURED: crosssensor is 100% "train" (8000/8000) -- it ships NO validation
  # or test split. Filtering on "train" is therefore a no-op that gives false
  # confidence, so this is null and we must cut our own held-out split
  # geographically (adjacent NAIP tiles overlap, so a random split would leak).
  split: null

  # Transient-failure handling for the download. MEASURED: an unattended run died
  # after 121 samples with FileNotFoundError on the .taco URL -- fsspec's HTTP
  # layer maps EVERY non-OK status (429 rate limiting included) to
  # FileNotFoundError, so a momentary throttle looks like a missing file and
  # aborts the whole job. At ~10.4 s/sample a full 3000-sample fetch runs ~8.7
  # hours, which is far too long to be killed by one blip.
  max_retries: 6
  # Exponential: 15s, 30s, 60s, 120s, 240s between attempts. The long tail is
  # deliberate -- rate limits clear on the order of minutes, not seconds.
  retry_backoff_s: 15
  # Optional politeness delay between fetches, in seconds. 0 disables it. Raise
  # this if throttling persists despite retries.
  request_delay_s: 0.0

worldstrat:
  # UNVERIFIED LAYOUT. The Kaggle mount was not available when this was written,
  # so the directory structure below is a documented assumption, not a measured
  # fact. Run scripts/prepare_data.py --dataset worldstrat and read the error
  # it raises, or inspect /kaggle/input yourself, then correct these globs.
  # See src/data/worldstrat.py for the full list of assumptions.
  root_subdir: worldstrat
  hr_glob: "**/*_ps.tiff"
  lr_dir_name: L2A
  lr_glob: "*.tiff"
  num_samples: 3000
  # WorldStrat pairs are MULTI-FRAME LR (multiple revisits) with a single HR.
  # We take one revisit only -- see the known-limitation note in worldstrat.py.
  revisit_strategy: first

# Geographic train/val/test split. See src/data/splits.py for why this must not
# be random: adjacent NAIP quarter-quads overlap, so a random split puts nearly
# identical HR pixels in train and validation and inflates every reported number.
splits:
  fractions:
    train: 0.8
    val: 0.1
    test: 0.1
  # No two samples in different splits may be closer than this. Patches are
  # ~1.3 km across (130 px at 10 m GSD), so 5 km leaves a comfortable buffer
  # beyond any possible overlap. Raise it if the split report shows suspiciously
  # high validation scores; lower it only with a reason.
  min_separation_km: 5.0
  # Also group by the NAIP quarter-quad id parsed from the sample id. Records
  # sharing a quad come from one aerial scene and overlap regardless of centroid
  # distance.
  group_by_scene: true
  seed: 42
  # Written by scripts/make_splits.py, read back by the dataset when
  # cfg.dataset.split_file is set.
  output_name: "splits_{dataset}.csv"

# Patch extraction. The model trains on patches cut out of the stored tiles, not
# on whole tiles. lr_size here is the MODEL's input size; cfg.sr.lr_patch_size is
# the size of the tile the dataset emits, which must be >= lr_size. They are
# separate knobs on purpose: shrinking the model's receptive field must not
# require re-cropping (or re-downloading) the data.
patches:
  # LR patch edge in pixels. The HR patch is exactly lr_size * sr.scale, and the
  # HR crop origin is exactly scale * the LR crop origin -- asserted on every
  # call in src/data/patches.py. An off-by-one here is invisible in the loss and
  # fatal to the model.
  lr_size: 64
  # Stride in LR pixels for deterministic grid extraction (validation). Set
  # below lr_size for overlapping patches.
  stride: 64
  # Default extraction mode: "grid" (deterministic, validation) or "random"
  # (random crop, training).
  mode: grid
  # Random crops drawn per source tile per epoch, in "random" mode.
  random_per_sample: 1

  # WHY lr_size (64) IS BELOW sr.lr_patch_size (128), and why they must not be
  # equal. MEASURED: when the patch equals the tile, grid mode yields exactly one
  # patch per tile and random mode returns the identical crop every epoch -- the
  # augmentation silently becomes a no-op, and ~75% of every downloaded 130x130
  # LR tile is thrown away. VERIFIED on the cached subset: 98 validation tiles
  # produced 98 patches at 64/64 but 391 at 128/64, and the cloud rule then
  # rejected 1 of 392 candidates rather than 0 of 98 -- i.e. at 64/64 the filter
  # had nothing to filter. If you ever raise lr_size to 128, raise
  # sr.lr_patch_size with it (SEN2NAIPv2 stores 130 px LR tiles, so 128 is the
  # ceiling) or the patch pipeline collapses back to one fixed centre crop.
  # When a grid stride does not divide the tile evenly, emit one extra patch
  # flush against the right/bottom edge rather than discarding the margin.
  # Set true to drop the margin instead.
  drop_incomplete_edge: false

  # Rejection rules. Every rejection is counted per rule and logged -- a filter
  # that quietly eats 90% of the training set is worse than no filter at all.
  filters:
    enabled: true
    # Fraction of pixels that may be nodata before the patch is rejected.
    # Evaluated over LR and HR together.
    max_nodata_fraction: 0.05
    # Cloud proxy. SEN2NAIPv2 ships NO cloud mask, so "cloud" here means
    # "implausibly bright across all bands", which also catches snow and
    # specular roofs. It is a proxy and is documented as one; pass a real mask
    # to PatchFilter when a dataset provides one.
    # Reflectance above this in EVERY band counts a pixel as cloud-like.
    bright_reflectance: 0.6
    max_bright_fraction: 0.20
    # Near-constant patches (flat water, bare tarmac, fill) carry no
    # high-frequency signal to super-resolve and contribute only a bias toward
    # blurring. Threshold is in reflectance units, on the HR patch.
    min_std: 0.005
    # How per-band standard deviations are combined: "mean" or "max".
    std_statistic: mean

# DataLoader construction. See src/data/loader.py.
loader:
  # Split assignment source. null means "read the CSV written by
  # scripts/make_splits.py" (paths.manifest_dir / splits.output_name). If that
  # file is absent the split is recomputed in-process with the same seed and
  # the same geographic rules, so a loader is never built on a random split.
  split_file: null
  train_split: train
  val_split: val
  # Only use samples already present in the local cache. The full download runs
  # for hours; this lets every downstream stage be exercised on the partial
  # cache without triggering fetches mid-epoch. The number of samples skipped is
  # logged, never silently absorbed. Set false once the download completes.
  cached_only: true
  # A split with fewer than this many samples is an error, not a warning: a
  # 1-sample validation set produces a meaningless curve.
  min_samples_per_split: 1
  shuffle_train: true
  drop_last: false
  pin_memory: false
  persistent_workers: false

# LR/HR co-registration audit. See src/eval/alignment.py and
# scripts/qa_alignment.py. Misaligned pairs destroy SR training silently: the
# model learns to blur, PSNR looks plausible, and nothing errors.
alignment:
  # Pairs sampled for the audit.
  num_pairs: 50
  # Sub-pixel resolution of the phase-correlation estimate: shifts are resolved
  # to 1/upsample_factor of an HR pixel.
  upsample_factor: 10
  # Band used for registration, by name from dataset.bands. Red has the most
  # land-surface structure of the visible bands and is present in every source
  # we might switch to.
  reference_band: B04
  # HR-pixel border excluded before registration. Bicubic upsampling and any
  # shift interpolation are unreliable at the edges, and phase correlation is
  # sensitive to that.
  border_crop_px: 8
  # Windowing applied before phase correlation: "hann" or null. A window
  # suppresses the edge discontinuity that otherwise shows up as a spurious
  # zero-shift peak.
  window: hann
  # Cross-power spectrum weighting: "none" (plain cross-correlation) or "phase"
  # (skimage's default phase correlation).
  # MEASURED, and this default is not skimage's: on exactly-aligned synthetic
  # pairs with a 2 px injected shift, "none" recovered (0.00, 0.00) on the
  # control and (2.00, 2.00) on the injected set, while "phase" returned
  # (1.40, 0.05) and (3.35, 0.65) -- a 1.4 px phantom shift on pairs that are
  # aligned by construction. The reason is structural: phase normalisation
  # weights every frequency equally, including the high frequencies where an
  # upsampled LR image has essentially no energy and the HR image is all
  # detail. LR/HR registration is exactly the case where the two spectra
  # disagree, so the phase-normalised peak is decided by bins the two images do
  # not share. Do not "fix" a noisy audit by switching this back.
  normalization: none
  # Verdict thresholds, in HR pixels of median shift magnitude.
  # < pass_threshold_px            -> PASS
  # [pass_threshold_px, warn_...]  -> WARN
  # > warn_threshold_px            -> FAIL
  pass_threshold_px: 1.0
  warn_threshold_px: 2.0
  # Per-band overlap required between the LR and HR reflectance ranges
  # (intersection over union of the p1-p99 intervals). Below this the two
  # sources are not radiometrically comparable and a PASS is downgraded.
  range_overlap_min: 0.5
  # Percentiles defining the "reflectance range" of a source, and the histogram
  # resolution in the figure.
  range_percentiles: [1.0, 99.0]
  histogram_bins: 60
  # Rows in the qualitative grid figure.
  figure_pairs: 20
  # Percentile stretch used ONLY to render figures. Display stretch, never
  # applied to data that reaches a loss or a metric.
  display_percentiles: [2.0, 98.0]
  # Bands composited into the RGB previews, by name from dataset.bands. Falls
  # back to a greyscale reference band when the dataset does not carry all three.
  display_rgb_bands: [B04, B03, B02]
  figure_dpi: 110
  # Estimator self-test. When set to [dy, dx] in HR pixels, the audit shifts HR
  # by that amount and checks the estimator recovers it -- proof the verdict can
  # be trusted before it is applied to real data. null on real runs; the smoke
  # block sets it.
  inject_shift_px: null
  inject_tolerance_px: 0.35
  report_name: alignment_report.json
  grid_figure_name: alignment_grid.png
  histogram_figure_name: alignment_histograms.png

sr:
  scale: 4
  # TILE sizes in pixels -- the crop the dataset emits, NOT the model's input.
  # The model's patch size is cfg.patches.lr_size (64), cut out of these tiles.
  # hr_patch_size must equal lr_patch_size * scale.
  # 128 is the largest multiple of the 64 px patch that fits SEN2NAIPv2's stored
  # 130x130 LR tiles. It gives 4 non-overlapping grid patches per tile and room
  # for genuinely varied random crops; see the note in cfg.patches for the
  # measurement, and do not lower it to 64 without lowering patches.lr_size too.
  lr_patch_size: 128
  hr_patch_size: 512

train:
  batch_size: 16
  num_workers: 2
  epochs: 100

# Image-quality metrics. See src/metrics/image_quality.py for the definitions and
# src/metrics/aggregate.py for the harness that applies them.
#
# THIS BLOCK IS PERMANENT. The bicubic baseline, every ablation, and the final
# INT8 ONNX model are all scored through the same Evaluator with the same
# settings; changing a value here invalidates every previously reported number,
# so any change means re-running the baseline too.
metrics:
  # Which metrics to compute. Removing one from this list removes its columns
  # from the per-sample CSV and the summary.
  enabled: [psnr, ssim, sam, ergas, lpips]

  # Peak reflectance for PSNR and the SSIM constants, in REFLECTANCE UNITS.
  # FIXED, deliberately: this is cfg.dataset.reflectance_nominal_max, not each
  # tile's own max. A per-image data range makes a bright tile score better for
  # being bright and makes two runs incomparable. Reflectance above 1.0 is legal
  # and is NOT clipped -- a bright tile simply reports a lower PSNR, which is the
  # honest reading.
  data_range: 1.0

  # Reported alongside mean and std for every metric. A mean PSNR hides the
  # failure cases; p5 is where they live.
  percentiles: [5.0, 95.0]

  ssim:
    # Wang et al. (2004) settings, which are NOT scikit-image's defaults
    # (7x7 uniform window, sample covariance). Passed explicitly so a number
    # here is comparable to a published one; use_sample_covariance=False is
    # hardcoded in src/metrics/image_quality.ssim for the same reason.
    gaussian_weights: true
    sigma: 1.5
    # null lets scikit-image derive the window (11 px at sigma 1.5). Must be odd
    # and no larger than the shorter side of the HR patch
    # (cfg.patches.lr_size * cfg.sr.scale).
    win_size: null

  sam:
    # Where a pixel's spectrum is the all-zero vector the angle does not exist.
    # "nan" excludes and counts those pixels; "error" raises. There is
    # deliberately no policy that calls them 0 degrees -- that would report
    # perfect spectral fidelity over nodata.
    zero_vector_policy: nan
    # Percentile of the per-pixel SAM map reported per sample, next to the mean.
    # A 1 degree mean with a 12 degree tail is a model that is wrong exactly
    # where it matters, and only this column shows it.
    report_percentile: 95.0

  ergas:
    # A reference band whose mean is exactly 0 makes ERGAS undefined. That means
    # the patch is nodata and should have been rejected by cfg.patches.filters,
    # so the default is to raise rather than to score it. "nan" defers to the
    # aggregator, which counts non-finite values per metric.
    zero_mean_policy: error

  lpips:
    # OFF BY DEFAULT IN SMOKE ONLY (see the smoke block). LPIPS needs pretrained
    # backbone weights, downloaded on first use, so it cannot run without
    # internet -- on Kaggle, enable the notebook's internet toggle.
    enabled: true
    # "alex" is the backbone the LPIPS authors recommend for evaluation.
    net: alex
    # Band names, by name from dataset.bands, composited as (R, G, B). Resolved
    # through src/metrics/image_quality.rgb_band_indices so a change to the band
    # order cannot silently feed LPIPS a blue/green/red image.
    rgb_bands: [B04, B03, B02]
    # REQUIRED CLIP, and the only clip in the metrics module. The network's
    # domain is [-1, 1], so reflectance must be clipped into [0, 1] first.
    # Applied to a temporary copy inside the metric; the fraction of clipped
    # values is reported per sample as lpips_clipped_frac so a suspiciously good
    # LPIPS on a cloudy tile is recognisable as an artefact of the clip.
    clip_reflectance: true

# Non-learned baselines. See src/eval/baselines.py and scripts/run_baseline.py.
baseline:
  # Methods scripts/run_baseline.py accepts. bicubic is THE BAR every model must
  # clear; nearest is the absolute floor, which is what makes a bicubic score
  # legible rather than merely large.
  methods: [bicubic, nearest]
  # Antialiased bicubic (the a=-0.5 MATLAB/PIL kernel). MEASURED: the two torch
  # bicubic kernels differ by up to 0.083 reflectance on a x4 upsample, which is
  # larger than the gap between competing architectures -- so this is a
  # comparability setting, not a cosmetic one. See src/eval/baselines.py.
  antialias: true
  # Output names. {method} is filled in, so a bicubic run can never overwrite a
  # nearest one.
  csv_name: "baseline_{method}.csv"
  json_name: "baseline_{method}.json"
  figure_name: "baseline_qualitative.png"
  # Rows in the qualitative figure: LR / SR / HR / SAM map, spread evenly across
  # the validation set rather than taken from the front (the first patches of a
  # grid-ordered split all come from one tile).
  figure_samples: 6
  # Display stretch for the figure ONLY, never applied to data that reaches a
  # metric. Same convention as cfg.alignment.
  display_percentiles: [2.0, 98.0]
  display_rgb_bands: [B04, B03, B02]
  # Upper limit of the SAM colour bar, in degrees, shared by every row so the
  # panels are comparable. null derives it from the 99th percentile of the maps
  # actually shown, and the value used is logged and printed in the caption.
  sam_vmax_deg: null
  figure_dpi: 110

# opensr-test: the external, third-party benchmark for Sentinel-2 SR.
#
# WHY IT IS HERE AND NOT JUST PSNR. Every number in cfg.metrics is ours: we wrote
# the implementation, chose the data range, and picked the split. A judge has no
# reason to take any of it on trust. opensr-test (Aybar et al., IEEE JSTARS 2024,
# ESA OpenSR) is an independent implementation that asks a question PSNR cannot:
# not "how close is SR to HR" but "is the detail SR invented actually there".
# That maps directly onto contribution 2, the hallucination map.
#
# INPUT CONTRACT -- MEASURED against opensr_test 1.3.3, and asserted in
# src/eval/opensr_harness.py rather than trusted:
#   - torch.Tensor only. A numpy array raises AttributeError on .requires_grad.
#   - (C, H, W), ONE SAMPLE. There is no batch path; (B, C, H, W) raises.
#   - float32/float64. uint16 raises inside interpolate.
#   - C >= 3. C == 1 raises: a .squeeze() in apply_upsampling eats the channel.
#   - SURFACE REFLECTANCE, i.e. digital number / 10000, matching
#     cfg.dataset.reflectance_scale. This one does NOT raise when it is wrong,
#     which is why max_reflectance below exists -- see its comment.
#   - Band order RGBNIR. cfg.dataset.bands is [B04, B03, B02, B08], which is
#     exactly the order opensr-test's own datasets use, so no remapping is
#     needed. Verified against the upstream README, which slices [idx, 0:3] and
#     documents the result as Red, Green, Blue.
opensr_test:
  # Kept separate from cfg.metrics: these are a THIRD PARTY's definitions and
  # must not be tuned to flatter us. Changing anything here changes what the
  # external benchmark means, so each value below is upstream's default unless
  # the comment says otherwise and says why.
  enabled: true

  # cfg.runtime.num_threads still governs the thread count; this is the torch
  # device opensr-test moves tensors onto. CPU is the working default, per the
  # project's compute constraints.
  device: cpu

  # Aggregation for the distance metrics. "pixel" is upstream's default and
  # needs no patch_size. "patch" additionally requires SQUARE inputs and
  # patch_size < the image side; "image" collapses each metric to one number.
  agg_method: pixel
  patch_size: null

  # Border pixels discarded before scoring. Upstream default is 16, applied to
  # HR/SR, with border_mask // scale (= 4) applied to LR so the two stay
  # commensurate. CAVEAT, recorded honestly: upstream's own datasets have
  # 484-512 px HR patches and ours are 256, so 16 px removes a larger FRACTION
  # here than it does there -- about 25% of the LR patch area. The value is left
  # at upstream's default anyway, because a benchmark retuned to suit our patch
  # size is no longer an external benchmark. If it is ever changed, the change
  # belongs in the report, not just here.
  border_mask: 16

  # Resolved to channel indices BY NAME through
  # src.metrics.image_quality.rgb_band_indices, never assumed to be [0, 1, 2].
  # Used by opensr-test for the spatial PCC and for the lpips/clip distances.
  rgb_bands: [B04, B03, B02]

  # Systematic-error removal before the synthesis and correctness metrics.
  # Upstream defaults, both on: histogram-matches SR to HR, then registers it.
  # This is what makes "did the model invent detail" separable from "is the
  # model brighter than HR" -- which is exactly the distinction we need, so it
  # stays on. Note it means the correctness numbers do NOT penalise a global
  # radiometric offset; cfg.metrics' SAM and our spectral-consistency loss do.
  harm_apply_spectral: true
  harm_apply_spatial: true

  # Spatial consistency. "pcc" (phase correlation) is upstream's default and
  # needs no extra weights; "lgm" would pull in LightGlue. The threshold is the
  # maximum translation searched, in LR pixels.
  spatial_method: pcc
  spatial_threshold_distance: 5
  spatial_max_num_keypoints: 500

  # Distance functions, all upstream defaults.
  #   reflectance: l1  -- absolute, so it MOVES WITH THE INPUT SCALE.
  #   spectral:    sad -- spectral angle, in DEGREES, scale-invariant.
  #   synthesis:   l1  -- absolute, also moves with the input scale.
  #   correctness: nd  -- normalised difference, scale-invariant.
  reflectance_distance: l1
  spectral_distance: sad
  synthesis_distance: l1
  correctness_distance: nd

  # Correctness normalisation. "softmin" reports the mean soft assignment to
  # each of the three classes; "percent" reports hard argmax fractions. Either
  # way the three sum to 1.0, which the harness asserts on every sample.
  correctness_norm: softmin
  im_score: 0.05
  om_score: 0.05
  ha_score: 0.05
  correctness_temperature: 0.25

  # Pixels whose LR-to-HR gradient is below this are excluded from the
  # correctness metrics -- flat water and bare field cannot hallucinate. "auto"
  # is upstream's default and resolves to the 75th percentile of the per-image
  # reference distance, so the threshold adapts per tile. A float fixes it.
  gradient_threshold: auto

  # How many validation samples to score. opensr-test runs ONE SAMPLE AT A TIME
  # on CPU and performs two image registrations per sample, so this is far
  # slower than cfg.metrics -- budget seconds per sample, not milliseconds.
  # null means the whole split.
  n_samples: 200

  # THE TRIPWIRE FOR A WRONG DIVISOR, and the reason it is not optional.
  # MEASURED on opensr_test 1.3.3: feeding digital numbers instead of
  # reflectance does NOT raise. It returns reflectance=2528.2 and
  # synthesis=2894.1 where the correct answers are 0.0018 and 0.074, while
  # spectral, ha, om and im are unchanged because they are scale-invariant. A
  # factor-of-10000 error is therefore invisible in four of the seven metrics
  # and silently wrong in the other two. So the harness refuses any triplet
  # whose maximum exceeds this. It is deliberately well above
  # cfg.dataset.reflectance_valid_max (2.0), because this is a decode-fault
  # tripwire and NOT a clip: real bright targets above 1.0 must pass through
  # untouched.
  max_reflectance: 10.0

  # Samples opensr-test rejects are recorded with their reason and counted, never
  # dropped from the denominator. If MORE than this fraction is rejected the run
  # FAILS rather than reporting a number computed on whatever survived. A
  # benchmark quietly measured on 60% of the split is worse than no benchmark.
  max_skipped_fraction: 0.10

  json_name: "opensr_{method}.json"
  csv_name: "opensr_{method}.csv"

# Degradation audit: is the LR a synthetic downsample of the HR, or a genuine
# second sensor?
#
# WHY THIS BLOCK EXISTS. scripts/verify_data_root.py printed LR and HR per-band
# reflectance min/max that agreed to four decimal places on every band, with the
# means differing only in the fourth decimal. Two sensors at 10 m and 2.5 m
# cannot produce that by coincidence, so it is either a reporting bug or the
# pair is not what the dataset card claims. scripts/audit_degradation.py settles
# it by measurement, and this block holds every constant that measurement uses.
#
# NOTHING HERE MAY BE TUNED TO PRODUCE A COMFORTABLE ANSWER. The thresholds
# below are stated in advance of the result on purpose; if a future run lands
# between them, the honest move is to report the ambiguity, not to move the line.
degradation_audit:
  # Pairs sampled without replacement, with cfg.seed, from the cached and
  # manifest-validated pool -- same selection machinery as cfg.alignment, for
  # the same reason: SEN2NAIPv2 records are ordered geographically, so the
  # first N are one grid cell rather than a sample of the archive.
  num_pairs: 200

  # Candidate degradation kernels, each mapping HR (C, 520, 520) -> (C, 130, 130)
  # so it can be scored against the stored LR. Implemented in
  # src.eval.degradation.DEGRADATION_KERNELS; an unknown name raises rather than
  # being skipped.
  #
  # The set spans the two families that behave differently under the test:
  # AVERAGING kernels (bicubic_antialias, bilinear_antialias, area, box) mix
  # neighbouring HR pixels and therefore REDUCE variance, while SAMPLING kernels
  # (bicubic_naive, nearest) take pixels through unchanged and preserve it. Which
  # family fits is more diagnostic than the winning PSNR alone -- see the
  # variance-ratio test below.
  kernels:
    - bicubic_antialias
    - bicubic_naive
    - bilinear_antialias
    - area
    - box
    - nearest

  # Nearest-subsampling has an unknown phase: HR pixel (0,0) may or may not be
  # the one that became LR pixel (0,0). Scoring a single phase would understate
  # the kernel's true fit, so all scale**2 = 16 offsets are tried per sample and
  # the best is reported, along with which offset won. A synthetic nearest
  # degradation shows the SAME winning offset on essentially every sample; a
  # coincidental fit scatters across offsets. The consistency is the evidence.
  nearest_search_all_offsets: true

  # Verdict thresholds on the best kernel's median PSNR, in dB, in the
  # reflectance domain at cfg.metrics.data_range.
  #
  # Above synthetic_psnr_db the LR is a resampling of the HR: the residual is at
  # the level of uint16 rounding, and the SR task is then to invert a known
  # analytic operator, which is not the stated problem and would not survive
  # review.
  synthetic_psnr_db: 45.0
  # Below crosssensor_psnr_db the residual is large enough to be two genuinely
  # different acquisitions. Between the two is UNRESOLVED and is reported as
  # such.
  crosssensor_psnr_db: 35.0

  # THRESHOLD-FREE DISCRIMINATORS. Added after the first real run landed at
  # 45.38 dB -- 0.38 dB on the synthetic side of the line above, while the
  # variance test said the opposite. A verdict that can be decided by 0.38 dB is
  # not a verdict, so these two tests were added; NEITHER of them depends on a
  # dB threshold chosen by us, and both are properties a synthetic degradation
  # cannot avoid.
  #
  # 1. SPREAD. A deterministic operator applied to 200 tiles produces nearly the
  #    same PSNR on every one of them. MEASURED on the synthetic stub, whose LR
  #    IS an exact block mean: p95 - p5 = 0.09 dB. Real cross-sensor pairs spread
  #    over 13.15 dB, because two acquisitions disagree by different amounts over
  #    different terrain. Above this many dB of spread, no single deterministic
  #    kernel produced the LR.
  deterministic_spread_db: 2.0
  #
  # 2. THE QUANTISATION CEILING, computed rather than configured, from
  #    cfg.dataset.reflectance_scale and cfg.metrics.data_range: a synthetic
  #    degradation computed in float and stored as uint16 can only differ from
  #    its own kernel by the rounding, which puts it near 90.8 dB at scale
  #    10000. Anything tens of dB below that ceiling has a residual far larger
  #    than rounding, i.e. real content the kernel does not explain. The fraction
  #    of the ceiling required before a fit counts as "the LR IS this kernel's
  #    output":
  quantisation_ceiling_fraction: 0.75

  # The floor. Each sample's LR is also scored against the degraded HR of a
  # DIFFERENT, randomly paired sample. Without this control a PSNR has no scale:
  # natural imagery over similar terrain scores far above zero, so "41 dB" means
  # nothing until "unrelated tiles score X dB" is on the same page.
  control_mismatched_pairs: true

  # Marginal-distribution test, which separates the two hypotheses that both
  # produce matching min/max:
  #   H1 the LR was downsampled from the HR -- any averaging kernel must LOWER
  #      the variance, so std_lr / std_hr < 1 by a visible margin;
  #   H2 the HR was radiometrically harmonised (histogram-matched) to the LR --
  #      the marginals then agree BY CONSTRUCTION while the spatial content
  #      stays genuinely different, and std_lr / std_hr ~= 1.
  # variance_ratio_tol is how close to 1.0 the median ratio must sit before H2
  # is reported as the explanation.
  variance_ratio_tol: 0.02
  # Quantiles compared per band between LR and HR, as percentages.
  quantiles: [0, 1, 5, 25, 50, 75, 95, 99, 100]

  # Reported percentiles of every per-sample distribution. A mean alone is what
  # let this go unnoticed; the spread is the finding.
  percentiles: [0, 5, 25, 50, 75, 95, 100]

  # Also score bicubic UPSAMPLING of the LR against the HR -- the x4 SR baseline
  # number (38.47 dB) that this audit exists to either justify or discredit.
  # Cheap, and printing the two numbers side by side is the entire point.
  include_upsample_baseline: true

  report_name: degradation_audit.json
  csv_name: degradation_audit_per_sample.csv

# Smoke mode: every entry-point script must accept --smoke and, when set, merge
# this block over the config so a full run completes in a couple of minutes on CPU.
#
# Smoke switches dataset.name to the synthetic stub, which fabricates samples in
# memory. This is deliberate: --smoke must NEVER touch the network, so it
# exercises the full interface, validation, and manifest path without a download.
smoke:
  dataset:
    name: synthetic_stub
  delhi:
    # --smoke MUST NOT touch the network (see the note above this block), and a
    # download script has no offline half worth rehearsing on its own. So smoke
    # runs the whole write path -- band ordering from dataset.bands, the
    # WGS84 -> native-UTM bbox transform, the uint16 stack, the GeoTIFF profile,
    # the statistics and the manifest schema -- against a raster fabricated in
    # memory, and skips ONLY the STAC search and the HTTP read. It proves the
    # plumbing; it cannot prove the imagery.
    #
    # UTM 43N, which is the zone Delhi actually falls in, so the smoke fixture
    # exercises a realistic projected transform rather than a toy one.
    smoke_crs: EPSG:32643
    smoke_size_px: 128
    # Separate names so a --smoke run can never overwrite a real scene or, worse,
    # leave a manifest of fabricated pixels sitting where the real one belongs.
    filename_template: "delhi_{name}_{date}_smoke.tif"
    manifest_name: manifest_smoke.json
  synthetic_stub:
    num_samples: 12
  validate_sr:
    # Smoke validates the FABRICATED pair that smoke_view writes, so the two
    # smoke paths compose: run smoke_view --smoke, then validate_sr --smoke,
    # and the validator has something real to read. Its verdict describes
    # invented imagery and means nothing beyond "the checks execute".
    input: outputs/smoke/delhi_smoke_lr.tif
    sr: outputs/smoke/delhi_smoke_sr.tif
  smoke_view:
    # There is no Delhi raster and no SR output in a clean checkout, and
    # --smoke must not touch the network. So smoke FABRICATES an LR/SR GeoTIFF
    # pair -- real files, written and read back through rasterio with a real
    # UTM transform -- and then runs the identical figure code over them. The
    # crop search, the shared stretch, the band-name resolution and both
    # figures are all exercised; only the imagery is invented.
    fabricate: true
    fabricate_size_lr_px: 96
    crop_lr_px: 32
    overview_long_edge_px: 240
    input: outputs/smoke/delhi_smoke_lr.tif
    sr: outputs/smoke/delhi_smoke_sr.tif
    out_crop: outputs/figures/day2_smoke_smoke.png
    out_full: outputs/figures/day2_smoke_full_smoke.png
  eval_runA:
    # There is no trained checkpoint for the synthetic stub, and inventing one
    # in code would leave the checkpoint-loading path -- the part most likely to
    # break on a format change -- untested. So --smoke FABRICATES a complete run
    # directory instead: a freshly initialised EDSR saved in the real
    # checkpoint format, a real args.json, and a short log.csv. Everything
    # downstream (load, evaluate, gate, report, curve figure) then runs exactly
    # as it does for real, on files that were genuinely written and read back.
    fabricate_run: true
    # Iterations represented in the fabricated log.csv, so the curve figure has
    # both a loss trace and several validation points to draw.
    fabricate_iters: 1200
    # Separate paths, for the same reason cfg.smoke.alignment has them: a report
    # full of stub numbers sitting at the real report's path is the kind of
    # thing that gets read later and believed.
    run_dir: outputs/eval_runA_smoke
    report_md: outputs/metrics/day2_runA_smoke.md
    report_json: outputs/metrics/day2_runA_smoke.json
    curves_figure: outputs/figures/day2_curves_smoke.png
    per_sample_csv_name: "day2_runA_smoke_{method}.csv"
  train:
    batch_size: 2
    num_workers: 0
    epochs: 1
  loader:
    # The stub fabricates its samples, so nothing is cached and nothing needs to
    # be: cached_only would filter every sample away.
    cached_only: false
  patches:
    # A 32 px patch on a 32 px stride over the stub's 128 px tiles gives 16 grid
    # patches per tile: enough to exercise the multi-patch path (which one patch
    # per tile would not), few enough that the pre-flight stays quick.
    lr_size: 32
    stride: 32
  alignment:
    num_pairs: 8
    figure_pairs: 4
    # THE POINT OF THE SMOKE RUN. Stub pairs are exactly aligned, so the audit
    # shifts HR by a known (dy, dx) and checks the estimator recovers it. Until
    # that self-test passes, the verdict the audit prints on real data means
    # nothing.
    inject_shift_px: [2.0, 2.0]
    # Separate filenames so a quick --smoke check never overwrites the audit of
    # the real data. A stub report sitting at the real report's path, with a FAIL
    # in it that is only an artefact of the injected shift, is exactly the kind
    # of thing that gets read at 3 a.m. and believed.
    report_name: alignment_report_smoke.json
    grid_figure_name: alignment_grid_smoke.png
    histogram_figure_name: alignment_histograms_smoke.png
  degradation_audit:
    # THE POINT OF THE SMOKE RUN, and it is a real self-test rather than a
    # rehearsal. The synthetic stub builds its LR as an exact block-mean
    # downsample of its HR (see src/data/synthetic.py), so --smoke feeds the
    # audit a pair that IS synthetically degraded, by construction and by a
    # kernel that is in the candidate list. A correct audit must therefore
    # return verdict SYNTHETIC, name "box" (or "area", which is identical at
    # integer scale) as the best kernel, and report a PSNR at the numerical
    # ceiling. Until that passes, the verdict it prints on real data means
    # nothing.
    num_pairs: 8
    # Separate filenames so a smoke check never overwrites the real audit. A
    # stub report sitting at the real report's path -- reading SYNTHETIC, which
    # for the stub is the CORRECT answer -- is exactly the kind of thing that
    # gets found later and believed.
    report_name: degradation_audit_smoke.json
    csv_name: degradation_audit_per_sample_smoke.csv
  metrics:
    lpips:
      # --smoke MUST NEVER TOUCH THE NETWORK, and LPIPS downloads pretrained
      # backbone weights on first use. The other four metrics exercise the whole
      # Evaluator path, so nothing about the pre-flight is weakened by this.
      enabled: false
  kaggle:
    # Separate staging folders, for the same reason the figure and metric names
    # are separated above: a --smoke run fabricates FAKE samples, and a folder
    # of fake .npz sitting at the real staging path is exactly the thing that
    # gets uploaded by mistake at 3 a.m.
    staging_dir: outputs/kaggle_staging_smoke
    dryrun_staging_dir: outputs/kaggle_staging_smoke_dryrun
  opensr_test:
    # Separate filenames, for exactly the reason the baseline block below gives:
    # the stub's LR is an exact block mean of its own HR, so its correctness
    # figures describe that construction rather than super-resolution. A stub
    # result sitting at the real result's path is a number that gets quoted in a
    # report later and believed. MEASURED the hard way -- the first smoke run of
    # scripts/run_opensr_test.py overwrote outputs/metrics/opensr_bicubic.json
    # with 16 rows of stub scores, and nothing in the file said so.
    json_name: "opensr_{method}_smoke.json"
    csv_name: "opensr_{method}_smoke.csv"
    # 16 patches is the whole stub val split: enough to exercise the batching,
    # the skip path and the summary, fast enough to stay a pre-flight.
    n_samples: 16

  baseline:
    figure_samples: 3
    # Separate filenames, for the same reason as the alignment block above: a
    # stub result sitting at the real result's path is a number that gets quoted
    # later and believed. Stub PSNR is meaningless -- the stub's LR is an exact
    # block mean of its own HR, so bicubic scores far better on it than on real
    # Sentinel-2 data ever will.
    csv_name: "baseline_{method}_smoke.csv"
    json_name: "baseline_{method}_smoke.json"
    figure_name: "baseline_qualitative_smoke.png"

synthetic_stub:
  # In-memory fake used by --smoke and by the contract tests. Never downloads.
  num_samples: 4
  seed: 0

# Publishing the local sample cache as a Kaggle Dataset, so a GPU notebook reads
# ~3000 pre-downloaded SEN2NAIPv2 pairs from a read-only mount instead of
# re-fetching them (MEASURED at ~10.4 s/sample, i.e. ~8.7 h) inside the session.
# Driven entirely by scripts/kaggle_upload.py -- no shell one-liners, no JSON
# edited by hand.
kaggle:
  # Dataset NAME, no owner prefix. The API slug is "<username>/<dataset_slug>",
  # with the username read out of the credentials file below; the Kaggle mount
  # path uses this bare name (see paths.kaggle_dataset_dir, which must match).
  #
  # Kaggle's rules, enforced by scripts/kaggle_upload.py BEFORE any upload
  # starts, because finding out after a 3.9 GB transfer is the expensive way:
  # lowercase letters, digits and hyphens only, 6-50 characters.
  dataset_slug: drishtisr-sen2naipv2-cache
  # Shown on the dataset page. Kaggle rejects titles under 6 characters.
  dataset_title: DrishtiSR SEN2NAIPv2 Cache

  # Separate slug and staging folder for the `dryrun` subcommand, so a 5-sample
  # test upload can never collide with, or overwrite, the real dataset.
  dryrun_slug: drishtisr-sen2naipv2-dryrun
  dryrun_title: DrishtiSR SEN2NAIPv2 Dry Run
  dryrun_samples: 5

  # Staging folders, relative to the repository root. Gitignored via outputs/.
  # Staging COPIES rather than moves: a failed upload must never be able to
  # damage the only copy of an 8.7-hour download.
  staging_dir: outputs/kaggle_staging
  dryrun_staging_dir: outputs/kaggle_staging_dryrun

  # Refuse to stage unless this much free space remains AFTER the copy.
  free_space_margin_gb: 2.0

  # Private by default. A Sentinel-2/NAIP derivative is redistributable, but
  # publishing it is a decision to make deliberately on the dataset page, not a
  # side effect of running an upload script.
  is_private: true
  licence: CC0-1.0

  # Where the Kaggle API token lives. "~" expands to the user's home directory.
  # Created by downloading kaggle.json from
  # https://www.kaggle.com/settings/account -> API -> Create New Token.
  credentials_file: ~/.kaggle/kaggle.json

  # checksums.csv covers every staged file so a truncated upload is detectable
  # on the Kaggle side. blake2b is roughly 3x faster than sha256 on CPU and this
  # runs over ~3.9 GB; 16 bytes of digest is ample for detecting corruption
  # (it is not, and does not need to be, a defence against a forged file).
  checksum_algorithm: blake2b
  checksum_digest_bytes: 16
  checksum_chunk_bytes: 4194304

  # Upload-time estimates are printed at these link speeds, in Mbps. Home
  # connections are asymmetric: quote UPLOAD speed, which is usually far below
  # the advertised download figure.
  upload_speeds_mbps: [5, 20, 50]

  # Programmatic verification after `dryrun`: poll `kaggle datasets files`
  # until Kaggle has finished unpacking the upload, then check that the .npz
  # files came back NESTED inside the subset folder rather than flat. This is
  # what proves --dir-mode zip round-tripped, without opening a browser.
  # Kaggle's server-side processing is usually well under a minute but is
  # occasionally backed up, hence the generous ceiling.
  verify_timeout_s: 600
  verify_poll_interval_s: 15
  # Kaggle pages `datasets files` at 200 entries. The full cache is 6008
  # files = 31 pages, so a single-page read would report a complete upload
  # as 3% arrived. This ceiling stops a runaway loop if paging misbehaves;
  # exceeding it is logged as an INCOMPLETE listing, never as a pass.
  max_listing_pages: 100

  # Seconds before a kaggle CLI call is treated as hung. The real upload needs a
  # long ceiling -- 3.9 GB at 5 Mbps is nearly two hours.
  cli_timeout_s: 14400
  metadata_timeout_s: 120

# Headless driving of Kaggle notebook jobs: scripts/kaggle_run.py. The jobs
# themselves are defined in configs/kaggle_jobs.yaml; this block is the runner's
# own machinery.
kaggle_run:
  # Job definitions, relative to the repository root.
  jobs_file: configs/kaggle_jobs.yaml

  # Generated notebooks and kernel-metadata.json, one folder per job. Build
  # artefacts: gitignored, regenerated by every push, never hand-edited.
  kernel_build_dir: outputs/kaggle_kernels
  # Downloaded run outputs: outputs/kaggle/<job>/<timestamp>/.
  run_dir: outputs/kaggle

  # The kernel slug is "<job_slug_prefix><job>", which keeps every kernel this
  # tool creates identifiable on the Kaggle account and clear of anything made
  # in the browser. Kaggle requires 5-60 characters, lowercase and hyphens.
  slug_prefix: drishtisr-
  # Where the notebook clones from. Null means "read it from `git remote get-url
  # origin`", which is right for every checkout. Set it only to force a fork or
  # a mirror, and remember Kaggle must be able to clone it ANONYMOUSLY -- a
  # private GitHub repo will fail inside the session with an auth prompt.
  repo_url: null
  # The branch a push must be reachable from, i.e. the one Kaggle can clone.
  remote_branch: origin/main

  # THE ACCELERATOR. T4, never P100.
  #
  # Kaggle's default image ships a PyTorch built for cu128, whose binaries do
  # not include Pascal (sm_60) kernels. On a P100 that failure is nastier than a
  # missing GPU: torch imports, torch.cuda.is_available() returns True, the
  # device shows up with its right name, and then the first real CUDA op dies
  # with cudaErrorNoKernelImageForDevice -- after the session has already spent
  # minutes setting up. T4 (sm_75) is covered by the same build.
  accelerator: NvidiaTeslaT4

  # THE GUARD THAT MAKES THE LINE ABOVE MORE THAN A COMMENT.
  #
  # Checked by validate_job() at JOBS-FILE LOAD TIME, so it fires on every
  # command -- jobs, push, status, logs -- for every GPU job, before anything
  # is generated and long before anything is pushed. It used to be enforced
  # only by a pytest and by this default; a job that set `accelerator:
  # NvidiaTeslaP100` by hand would have been pushed without complaint.
  #
  # Values are kagglesdk ApiSaveKernelRequest.machine_shape names. Anything not
  # on this list is refused rather than passed through: Kaggle silently ignores
  # a machine_shape it does not recognise and falls back to its default GPU,
  # which is the exact failure mode that cost a runA session.
  allowed_accelerators:
    - NvidiaTeslaT4
    - Tpu1VmV38
  # Refused with the specific reason rather than the generic "not allowed"
  # message, because this one has a story and someone will otherwise try it.
  forbidden_accelerators:
    NvidiaTeslaP100: >
      P100 is Pascal (sm_60) and the Kaggle image's cu128 PyTorch carries no
      Pascal kernels. torch imports, torch.cuda.is_available() returns True,
      the device names itself correctly, and the first real CUDA op dies with
      cudaErrorNoKernelImageForDevice -- after the session has queued, booted,
      cloned and installed. Use NvidiaTeslaT4 (sm_75).

  # `status --watch` polling. 60 s is well inside Kaggle's rate limits and fine
  # for jobs measured in minutes to hours; the ceiling is a stop so an
  # unattended watch cannot poll for days against a wedged session.
  poll_interval_s: 60
  watch_timeout_s: 43200

  # Seconds before a kaggle CLI call is treated as hung. `fetch` gets its own
  # ceiling because it moves checkpoints, which are far bigger than a log.
  cli_timeout_s: 1800
  fetch_timeout_s: 3600

  # `logs` prints tail-first: the last line is the failure, and scrolling up
  # through an hour of training output to find it is the wrong default.
  log_tail_lines: 200

  # GPU-budget bookkeeping. The Kaggle public API exposes no quota endpoint, so
  # `push` cannot report the real remaining figure -- it reports what THIS TOOL
  # has started since the week began, which is a floor, not the quota, and says
  # so. Anything launched from the browser is invisible to it.
  gpu_ledger: outputs/kaggle/gpu_ledger.json
  weekly_gpu_hours: 30
  # Kaggle's quota week resets Saturday 00:00 UTC. 5 = Saturday (Monday is 0),
  # matching datetime.weekday().
  quota_week_starts_on: 5
  quota_url: https://www.kaggle.com/settings

runtime:
  # Deployment target: INT8 ONNX on CPU. Enforced by the export/benchmark scripts.
  num_threads: 6
  max_parameters: 1000000

# Real Sentinel-2 L2A scenes over Delhi NCR, pulled from Microsoft Planetary
# Computer by scripts/fetch_delhi.py. These are INFERENCE/demo targets, not
# training data -- the model trains on SEN2NAIPv2 pairs and is then shown a
# scene from the actual deployment geography.
#
# BAND ORDER IS NOT SPECIFIED HERE ON PURPOSE. The stack order is read from
# `dataset.bands` (B04, B03, B02, B08 -- red, green, blue, NIR), so a scene
# fetched here cannot disagree with the channel axis the network was trained on.
# Duplicating the list in this block is exactly how the two drift apart.
delhi:
  stac_endpoint: https://planetarycomputer.microsoft.com/api/stac/v1
  collection: sentinel-2-l2a

  # Post-monsoon into late winter. The monsoon (Jun-Sep) leaves near-permanent
  # cloud over the NCR, and pre-monsoon May-Jun is dust-hazed; this window is
  # when the Gangetic plain is actually visible from orbit. Note it still
  # contains the Nov-Jan smog season, which is aerosol rather than cloud and so
  # is NOT caught by eo:cloud_cover -- inspect the chips, do not trust the flag.
  datetime_start: "2024-10-01"
  datetime_end: "2025-03-31"

  # STRICT. 5% cloud over a whole 110 km MGRS tile still permits a cloud sitting
  # on the AOI, which is why the best item is chosen by ascending cloud cover
  # rather than by taking the first that passes.
  max_cloud_cover: 5.0
  max_items: 200

  # Two AOIs, deliberately different land cover, so a super-resolution result is
  # not judged on one texture. WGS84 lon/lat, [west, south, east, north].
  aois:
    - name: A
      description: Central Delhi -- dense continuous urban fabric.
      bbox: [77.15, 28.55, 77.28, 28.66]
    - name: B
      description: Gurugram edge -- mixed urban, peri-urban and agriculture.
      bbox: [77.05, 28.38, 77.18, 28.49]

  # Gitignored (see .gitignore): these are imagery, and the manifest records
  # exactly which STAC items they came from so the fetch is reproducible
  # without versioning the pixels.
  output_dir: data/delhi
  manifest_name: manifest.json
  filename_template: "delhi_{name}_{date}.tif"
  filename_date_format: "%Y%m%d"

  # GeoTIFF creation. Deflate rather than JPEG: these are uint16 L2A digital
  # numbers feeding a reflectance-domain model, and lossy compression would
  # corrupt the radiometry the spectral-consistency objective depends on.
  tiled: true
  blocksize: 512
  compress: deflate

  # GDAL /vsicurl tuning for reading COGs over HTTPS. Without
  # GDAL_DISABLE_READDIR_ON_OPEN the driver lists the whole blob container
  # before every open, which turns a windowed read into minutes of stalling.
  gdal_env:
    GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
    GDAL_HTTP_MAX_RETRY: "5"
    GDAL_HTTP_RETRY_DELAY: "2"
    CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif"

  # Sanity bounds on the written pixels, in RAW L2A DIGITAL NUMBERS (divide by
  # dataset.reflectance_scale for reflectance). Checked and REPORTED, never
  # applied as a clip -- bright roofs and specular water legitimately run high,
  # and silently clamping them would destroy the very radiometry this scene is
  # being fetched to test. A violation is logged as a warning, not a crash.
  expect_dn_min: 0
  expect_dn_max: 12000

  # BOA_ADD_OFFSET, and why it needs a fallback at all.
  #
  # MEASURED 2026-09-07 against item
  # S2A_MSIL2A_20241030T052941_R105_T43RGM_20241030T093050 (baseline 05.11):
  # Planetary Computer's sentinel-2-l2a items expose the offset NOWHERE. There
  # is no `s2:boa_add_offset` property, and the assets carry no `raster:bands`
  # block -- only proj:*, gsd and eo:bands. So reading it from the item returns
  # nothing, even though the underlying ESA product certainly has one.
  #
  # Recording "no offset" there would be the worst outcome: reflectance would
  # come out 0.1 too high everywhere, which over water, asphalt and shadow --
  # most of an urban scene -- is a large fractional error, and it would look
  # like a plausible number rather than a missing one. So when the item is
  # silent, the offset is DERIVED from the processing baseline, and the
  # manifest records which of the two it was. ESA introduced the -1000 offset
  # at baseline 04.00 (2022-01-25); anything earlier genuinely has none.
  boa_offset_baseline_threshold: "04.00"
  boa_offset_dn: -1000.0

  # THE OFFSET TO ACTUALLY APPLY AT INFERENCE, as a value to SUBTRACT from the
  # raw DN on disk:  reflectance = (dn - dn_offset) / dataset.reflectance_scale
  # This is boa_offset_dn with the sign flipped, kept as a separate key because
  # it is the number a caller passes to src/infer/tiled.py --dn-offset, and a
  # sign error between "ESA publishes -1000" and "subtract 1000" is exactly the
  # bug this block exists to prevent.
  #
  # SETTLED EMPIRICALLY 2026-09-08, not from documentation. The question was
  # whether the SEN2NAIPv2 training data is itself offset-corrected; if it were
  # not, applying this would be the error rather than the fix. Measured over 250
  # random sen2naipv2-crosssensor LR patches -- the exact arrays the dataset
  # hands the model -- against delhi_A_20241030.tif:
  #
  #   median reflectance, SEN2NAIP LR vs Delhi:
  #     band   SEN2NAIP   delhi dn/10000   delhi (dn-1000)/10000
  #     B04      0.1104       0.1764  (+0.066)     0.0764  (-0.034)
  #     B03      0.0932       0.1750  (+0.082)     0.0750  (-0.018)
  #     B02      0.0664       0.1505  (+0.084)     0.0505  (-0.016)
  #     B08      0.2504       0.3077  (+0.057)     0.2077  (-0.043)
  #   sum |median offset|:  no-offset 0.289,  offset 0.111.
  #
  # And the decisive one, on raw DN: 82% of SEN2NAIP LR B02 pixels are below
  # DN 1000, with a floor at 0 -- in BOTH the pre-2022 and the 2022+ acquisition
  # cohorts, so the correction is a property of the dataset build and not of the
  # ESA baseline. Uncorrected baseline >= 04.00 product cannot reach below 1000.
  # Delhi's raw DN floors at 882/1019/0/1034, the uncorrected signature.
  #
  # Therefore SEN2NAIP is offset-corrected, data/delhi/*.tif is not, and
  # inference on Delhi MUST pass this. The p5-p95 span per band is identical
  # under both hypotheses (an additive shift cannot change a span), which is why
  # the verdict rests on the medians and the DN floor.
  dn_offset: 1000.0

# Run A evaluation: the trained EDSR-baseline checkpoint against the bicubic
# floor, read by scripts/eval_runA.py.
#
# THE POINT OF THIS BLOCK is that the comparison is honest by construction. The
# script does not re-implement a validation loop: it calls the same
# build_dataloaders() and the same metrics.aggregate.Evaluator that produced
# outputs/metrics/baseline_bicubic.json on Day 1, and re-scores bicubic in the
# same pass rather than quoting the stored number. Two runs of the same code on
# the same split are comparable; a stored number next to a fresh one is not,
# because nothing proves the split, the patch grid, or the LPIPS backbone did
# not move in between.
eval_runA:
  # Where the fetched Kaggle artefacts live. Relative to the repository root.
  # scripts/kaggle_run.py fetch drops them under outputs/kaggle/runa/; they are
  # copied here because outputs/ is gitignored wholesale and a checkpoint that
  # a report quotes must have a stable path.
  run_dir: runs/runA
  # Names inside run_dir. best.pt is the checkpoint selected by the training
  # loop's own periodic validation, which is a 25-batch subsample -- NOT the
  # full-split number this script computes.
  checkpoint_name: best.pt
  args_name: args.json
  log_csv_name: log.csv

  # Registry name for src/models/edsr.build_model. The ARCHITECTURE ITSELF is
  # not configured here: it is read from the "args" dict inside the checkpoint,
  # which is what the run actually used. A config value would be a second,
  # unverifiable claim about a file that already carries the truth.
  model_name: edsr_baseline

  # Method labels used in the table, the JSON, and the per-sample CSV names.
  bicubic_label: bicubic
  model_label: edsr_runA

  # Outputs. reports/ is versioned on purpose -- these are submission material.
  report_md: reports/day2_runA.md
  report_json: reports/day2_runA.json
  curves_figure: reports/day2_curves.png
  # Per-sample rows go to the gitignored metrics directory, like every other
  # evaluation: 1199 rows per method is not report material, but it is what
  # answers "where does it fail".
  per_sample_csv_name: "day2_runA_{method}.csv"

  # THE HARD GATE. The model must beat bicubic on every one of these, in the
  # stated direction, or it does not ship. Listed here rather than in code so
  # the criterion is visible next to the numbers it judges.
  #
  # "higher"/"lower" is the direction that counts as an improvement; the column
  # names are the keys of the Evaluator summary.
  gate:
    psnr_mean: higher
    ssim_mean: higher
    lpips: lower

  # Training-curve figure (scripts/eval_runA.py, src/eval/curves.py).
  curves_dpi: 130
  # Smoothing window for the training-loss trace, in logged points. The raw
  # per-100-iteration loss is noisy enough to hide the trend; the raw trace is
  # drawn underneath at low alpha so the smoothing cannot conceal anything.
  curves_loss_smooth: 9

# Publishing the Run A checkpoint to the Hugging Face Hub, read by
# scripts/push_to_hf.py.
#
# THE PUSH IS GATED ON THE EVALUATION, in code: the script refuses to upload
# unless reports/day2_runA.json records a PASSED gate. Publishing a checkpoint
# is not reversible in any way that matters -- the weights are fetched, cached
# and cited by other people -- so "the gate failed but push anyway" must not be
# a thing that can happen by typing one flag in a hurry.
huggingface:
  # Repository NAME only. The owner comes from whoami() on the token, so no
  # username enters version control and the repo works for anyone who clones it.
  repo_name: drishtisr-edsr-baseline-x4
  repo_type: model

  # PRIVATE BY DEFAULT, same reasoning as kaggle_jobs.yaml's is_private: a model
  # is a public artefact the moment it is not, and going public is a one-click
  # change on the Hub while un-publishing weights someone has already downloaded
  # is not. Set false here (or pass --public) when the repo is meant to ship.
  private: true

  # Environment variable holding the write token. NEVER put a token in this
  # file: it is version-controlled.
  token_env: HF_TOKEN

  # Files copied out of cfg.eval_runA.run_dir, verbatim. The model card is
  # GENERATED from the evaluation report (src/export/model_card.py) rather than
  # listed here, so its numbers cannot drift from the ones that were measured.
  files:
    - best.pt
    - args.json
    - log.csv
  card_name: README.md

  # Where the generated card is written locally before upload, so it can be read
  # and diffed rather than only existing on the Hub.
  card_output: reports/hf_model_card.md

  commit_message: >
    Run A: EDSR-baseline x4 for Sentinel-2 10 m -> 2.5 m, 4-band RGBN.
    L1 only, 40k iterations. Beats bicubic on PSNR, SSIM and LPIPS over the
    full 1199-patch validation split.

# ---------------------------------------------------------------------------
# scripts/validate_sr.py -- does the SR GeoTIFF survive contact with rasterio?
#
# Every bound here is a REFERENCE to a value that already exists elsewhere in
# this file, not a new number. The expected pixel size is dataset.hr_gsd_m, the
# DN bounds are delhi.expect_dn_min/max. A validator that carried its own copy
# of the truth would keep passing after the config it is meant to guard had
# changed underneath it.
validate_sr:
  input: data/delhi/delhi_A_20241030.tif
  sr: outputs/delhi_A_sr.tif
  scale: 4

  # Origin must be BIT-IDENTICAL, not merely close: the SR raster keeps the
  # input's top-left corner and only divides the pixel size. Tolerance is in
  # CRS units (metres for UTM) and exists for float round-trip through the
  # GeoTIFF header, not for genuine drift.
  origin_tol_m: 1.0e-6
  pixel_size_tol_m: 1.0e-6

  # Saturation at the storage ceiling is reported separately from the range
  # check. uint16 CANNOT hold a NaN, so "no NaN" is trivially true there and
  # would be a vacuous pass; the meaningful failure for an integer raster is
  # pixels pinned at 0 or 65535 by the write, which is what gets counted.
  saturation_frac_max: 0.001

# ---------------------------------------------------------------------------
# scripts/smoke_view.py -- the Day 2 eyeball test.
#
# This block configures a FIGURE, not a measurement. Nothing here may reach a
# loss or a metric; the percentile stretch below exists so a human can see
# reflectance on a screen, and applying it to data would be exactly the silent
# clipping the spectral-consistency contribution forbids.
smoke_view:
  # The scene to render and the SR raster to render against it. Both are
  # gitignored imagery; smoke mode fabricates its own pair instead.
  input: data/delhi/delhi_A_20241030.tif
  sr: outputs/delhi_A_sr.tif

  crop_lr_px: 256
  scale: 4

  # Bands composited into the RGB panels, resolved BY NAME against
  # dataset.bands rather than by position. delhi_*.tif is written R,G,B,NIR,
  # so a positional [0,1,2] happens to be right today and would silently
  # render false colour the day the band order changes.
  display_rgb_bands: [B04, B03, B02]

  # ONE stretch, computed once, applied to all three panels. A per-panel
  # stretch is how a super-resolution figure lies: it hands the blurriest
  # panel its own contrast boost and the comparison stops meaning anything.
  # Computed from the LR crop -- the common ancestor of all three panels, so
  # no panel gets a stretch fitted to itself.
  display_percentiles: [2.0, 98.0]

  # Where the built-up crop goes. null searches for one (see
  # select_builtup_crop); [x, y] in LR pixels pins it, which is what a report
  # should do once a crop has been chosen and discussed.
  crop_xy: null

  # Built-up search. Candidate windows are scored on low NDVI (built surfaces
  # are not vegetated) and high brightness variance (streets and roofs have
  # structure; bare fields and water do not). Both terms are needed: NDVI
  # alone picks water, variance alone picks field boundaries.
  search_stride_lr_px: 32
  # Fraction of the scene edge excluded from the search, so the chosen crop is
  # never a tile-border special case masquerading as a typical result.
  search_margin_frac: 0.05
  ndvi_weight: 1.0
  variance_weight: 1.0

  # Full-scene overview: the long edge is decimated to this many pixels. The
  # point of the overview is tile seams and global colour shift, both of which
  # survive decimation; per-pixel sharpness does not and is not claimed.
  overview_long_edge_px: 900

  figure_dpi: 140
  out_crop: outputs/day2_smoke.png
  out_full: outputs/day2_smoke_full.png

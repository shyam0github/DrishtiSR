# Kaggle job definitions, read by scripts/kaggle_run.py.
#
# One entry per job. A job is "a notebook that clones this repo at a commit and
# runs one entry point", so everything that varies between them lives here and
# nothing varies in the template. Adding a job is an edit to this file; it needs
# no new code.
#
# The runner's own settings -- poll intervals, timeouts, where generated
# notebooks are written -- live in the `kaggle_run` block of configs/base.yaml,
# because those are defaults, not per-job facts.
#
#     python scripts/kaggle_run.py jobs                 # what is defined here
#     python scripts/kaggle_run.py push   --job verify
#     python scripts/kaggle_run.py status --job verify --watch
#     python scripts/kaggle_run.py logs   --job verify
#     python scripts/kaggle_run.py fetch  --job verify

# Applied to every job, then overridden by the job's own keys. `dataset_sources`
# and `pip_packages` are REPLACED by a job that sets them, not merged -- a job
# that needs a different mount should state its full list.
defaults:
  # Notebook template, relative to the repository root. There is one, and jobs
  # are expected to share it: divergent templates are how "no logic in the
  # notebook" quietly stops being true.
  template: notebooks/templates/kaggle_job.py

  # Where the repo is cloned inside the session. MUST be under /kaggle/working:
  # that directory is what Kaggle saves as kernel output, so anything written
  # under outputs/ there survives the session and `fetch` can retrieve it.
  # /kaggle/temp is faster but is discarded when the session ends.
  workdir: /kaggle/working/DrishtiSR

  # Kaggle Datasets to mount, as bare slugs. The owner prefix is added from your
  # kaggle.json, so this file carries no username and works for anyone who
  # clones the repo. Fully-qualified "owner/slug" is accepted too, for someone
  # else's public dataset.
  #
  # MUST contain the cache dataset for any job that reads imagery: it mounts at
  # /kaggle/input/<slug>, which is what paths.kaggle_dataset_dir points at.
  dataset_sources:
    - drishtisr-sen2naipv2-cache

  # Only what the Kaggle image lacks. Deliberately NOT requirements.txt: that
  # file pins numpy/pandas/scipy/pillow, and installing those pins on Kaggle
  # downgrades packages the preinstalled PyTorch was built against -- minutes of
  # session time, and an image where CUDA may no longer import.
  #
  # MEASURED 2026-09-07, the hard way: the first real `baseline` run died three
  # minutes in with "ImportError: tacoreader is required for the sen2naipv2
  # dataset". The `verify` job had passed, which is why this went unnoticed --
  # verify_data_root.py reads .npz files and CSVs directly and never touches the
  # catalog, while ANY job that builds dataloaders does. build_dataloaders ->
  # resolve_split_assignments -> _split_records reads dataset.catalog to
  # enumerate sample_ids, and for SEN2NAIPv2 that lazily loads the TACO catalog,
  # which needs tacoreader. It does so even when every sample is cached and the
  # split CSV is present. See the note in docs/kaggle_workflow.md.
  #
  # In the shared defaults rather than on the two jobs that need it: `train`
  # would have hit exactly this, after queueing for a GPU. The install costs
  # `verify` about half a minute and buys the rest of the jobs a failure mode
  # that cannot recur.
  #
  # These are catalog dependencies only -- none of them pulls numpy, so the
  # opencv/numpy hazard documented in requirements.txt is not in play here.
  pip_packages:
    - omegaconf==2.3.0
    # Pinned for the same reason as in requirements.txt: we use tacoreader.v1,
    # which upstream calls legacy. An unpinned 2.x that drops it breaks the data
    # layer with no warning.
    - tacoreader==2.1.0
    # UNDECLARED dependency of tacoreader 2.1.0 -- tacoreader/dataset.py imports
    # pydantic but the package metadata does not list it, so `import tacoreader`
    # fails outright without this. Do not remove.
    #
    # This pin makes pip warn that the image's gradio wants pydantic<=2.12.3.
    # Cosmetic: nothing in this project imports gradio, and the run that
    # produced the warning went on to load the catalog correctly.
    - pydantic==2.13.5

  # Installed in a SECOND pip pass, with --no-deps. These are packages whose
  # declared dependencies would make pip re-resolve something the Kaggle image
  # already has correctly.
  #
  # MEASURED 2026-09-07: the second real `baseline` run got past tacoreader and
  # then died on "ModuleNotFoundError: No module named 'lpips'" -- LPIPS is in
  # cfg.metrics.enabled, so a baseline that reports it needs the package. lpips
  # 0.1.4 declares torch, torchvision, numpy, scipy and tqdm; all of those are
  # already correct on the image, and letting pip act on them risks resolving a
  # different torch than the preinstalled CUDA build. requirements.txt says the
  # same thing about the local install.
  #
  # LPIPS downloads ~233 MB of torchvision AlexNet weights on first use, so the
  # job needs enable_internet (it has it) and pays that once per session.
  pip_packages_no_deps:
    - lpips==0.1.4

  # Kaggle needs internet to clone from GitHub and to pip install. A job with
  # this false cannot bootstrap at all; it is here to be explicit, not to tune.
  enable_internet: true

  # Run scripts/verify_data_root.py before the job and abort if it fails.
  # True everywhere except the job whose entry point IS that script.
  guard_data_root: true
  guard_script: scripts/verify_data_root.py
  guard_args: []

  # Inventoried and printed at the end of the run, and what `fetch` expects to
  # find. Relative to `workdir`.
  output_dirs:
    - outputs

  # Private by default: a kernel is a public artefact the moment it is not.
  is_private: true


jobs:

  # ---------------------------------------------------------------- verify ---
  verify:
    # Kaggle derives the kernel URL from the TITLE, so this must slugify to
    # exactly 'drishtisr-verify' -- see validate_job() in scripts/kaggle_run.py.
    # The readable version of this job lives in 'description' below, which the
    # generated notebook prints in its header.
    title: DrishtiSR verify
    description: >
      Prove a fresh Kaggle session can read the mounted SEN2NAIPv2 cache: resolve
      the paths, load the manifest and splits, open real samples and print their
      shapes, dtypes and per-band reflectance ranges. Run this after every
      dataset re-upload, before anything that costs GPU time.
    enable_gpu: false
    entry: scripts/verify_data_root.py
    entry_args: ["--config", "configs/base.yaml", "--samples", "5"]
    # The entry point IS the guard. Running it twice would only double the log.
    guard_data_root: false
    expected_runtime_min: 5

  # -------------------------------------------------------------- baseline ---
  baseline:
    title: DrishtiSR baseline
    description: >
      Evaluate the non-learned super-resolution baselines over the validation
      split and write CSV, JSON, a markdown table and the qualitative SAM panel.
      CPU-only on purpose: these are interpolation baselines, a GPU would buy
      nothing, and GPU-hours are the scarce resource.
    enable_gpu: false
    entry: scripts/run_baseline.py
    entry_args: ["--config", "configs/base.yaml", "--baseline", "all"]
    expected_runtime_min: 45

  # ----------------------------------------------------------------- train ---
  # REMOVED 2026-09-08. It named `entry: scripts/train.py`, which has never
  # existed in this repository -- the trainer is src/train.py, reached as
  # `python -m drishtisr.train`, which is what `runa` below does. So the job was
  # unpushable from the day it was written: every attempt died in
  # generate_kernel()'s entry-point check. Its `entry_args` were wrong too
  # (`--config configs/base.yaml`; src/train.py takes no --config and requires
  # --data-module/--data-class/--data-root), so fixing only the path would have
  # traded a local failure for a Kaggle-side argparse failure after the queue
  # wait.
  #
  # It also carried the only in-repo statement of the T4-not-P100 rule outside a
  # comment and a pytest, and because the job could not be pushed that rule was
  # never enforced against a real job definition. It now is, at jobs-file load
  # time, by check_accelerator() in scripts/kaggle_run.py against
  # cfg.kaggle_run.allowed_accelerators -- so deleting this stub costs nothing
  # and removes a guard that only looked like one.
  #
  # Day 3's runs are defined by copying `runa`, which has actually run.


  # ------------------------------------------------------------------ runA ---
  # Run A: the EDSR-baseline L1 reference run. No uncertainty head, no spectral
  # loss -- this is the number every later contribution is measured against.
  #
  # Entry point is a MODULE, not a script. src/train.py imports
  # `drishtisr.models.edsr` and the adapter imports `src.data.loader`; only
  # `python -m` puts the clone root on sys.path so that both names resolve. See
  # run_module() in src/utils/kaggle_session.py and drishtisr/__init__.py.
  runa:
    title: DrishtiSR runA
    description: >
      Run A baseline: EDSR-baseline (16 blocks, 64 feats, 4-band RGBN,
      1,518,724 params) trained with L1 only for 40k iterations at batch 16 on
      64px LR patches, x4. Cosine schedule with warmup, AMP on, resumable from
      /kaggle/working/runs/runA/last.pt so a killed session continues rather
      than restarts.
    enable_gpu: true
    accelerator: NvidiaTeslaT4
    entry_module: drishtisr.train
    entry_args:
      - "--data-module"
      - "src.data.adapter"
      - "--data-class"
      - "SRPatchDataset"
      # NOT a literal mount path. MEASURED 2026-09-06: the live mount is
      # /kaggle/input/datasets/<owner>/<slug>, not /kaggle/input/<slug>, so a
      # spelled-out root is wrong on exactly the machine that costs GPU-hours.
      # "auto" defers to src/utils/paths.resolve_cache_dir, the only thing in
      # this project allowed to decide where data lives.
      - "--data-root"
      - "auto"
      - "--iters"
      - "40000"
      - "--batch"
      - "16"
      - "--patch-lr"
      - "64"
      - "--scale"
      - "4"
      # 4 = RGBN, the four bands of dataset.bands. This is what makes the
      # parameter count 1,518,724; in-ch 3 would give 1,517,571.
      - "--in-ch"
      - "4"
      # PINNED 2026-09-08, and it was previously implicit. Day 3 moved
      # src/train.py's --n-feats default from 64 to 48 (855,652 params, inside
      # cfg.runtime.max_parameters) and --wd's from 1e-4 to 0. This job relied
      # on the old defaults for n-feats, so without this line re-running it
      # would train a DIFFERENT model and quietly file the result under
      # "runA". Spelled out so this job keeps reproducing the run it describes.
      #
      # DO NOT reuse this job for a Day 3 run. Copy it, drop these two pins,
      # and take the values from configs/frozen_day3.yaml -- whose config_hash
      # must go into the run's metadata JSON.
      - "--n-feats"
      - "64"
      - "--lr"
      - "2e-4"
      - "--min-lr"
      - "1e-6"
      - "--warmup"
      - "500"
      - "--wd"
      - "1e-4"
      - "--clip"
      - "1.0"
      - "--val-every"
      - "2000"
      - "--ckpt-every"
      - "2500"
      - "--log-every"
      - "100"
      - "--amp"
      - "1"
      - "--workers"
      - "2"
      - "--seed"
      - "1337"
      # Under Kaggle's 9-hour ceiling, so the loop checkpoints and exits
      # cleanly instead of being killed mid-write.
      - "--max-hours"
      - "8.5"
      - "--resume"
      - "auto"
      # Outside the clone (workdir) on purpose: prune_workdir() clears the
      # clone at the end of a successful run, and /kaggle/working is what
      # Kaggle saves, so checkpoints here survive and are fetchable.
      - "--out"
      - "/kaggle/working/runs/runA"
    expected_runtime_min: 510

  # ------------------------------------------------------------------ day3 ---
  # THREE RUNS, ONE SESSION. A2 (control, spectral off), B1 (the primary
  # result), and B2 (upside, wall-clock guarded) -- all from
  # configs/frozen_day3.yaml, all at the same commit, differing in exactly two
  # floats.
  #
  # Entry is scripts/day3_runs.py rather than three copies of `runa` with
  # different lambdas, and that is the whole design. Three hand-written argument
  # lists that must agree in twenty places will eventually not, and the
  # disagreement surfaces as an unexplainable difference between two curves
  # after the GPU-hours are spent. The script builds ONE shared list, adds the
  # lambdas, and asserts before launching that nothing else differs.
  #
  # ONE session rather than three also fixes the accelerator: Kaggle honours
  # machine_shape silently or ignores it silently, so three sessions are three
  # chances to compare a T4 run against a P100 run without knowing it.
  day3:
    title: DrishtiSR day3
    description: >
      Day 3 spectral-consistency experiment: run A2 (lambda 0.0/0.0, the
      control), B1 (0.1/0.02, the primary result) and, if the clock allows, B2
      (0.3/0.06). 12k iterations each at batch 16 on 64px LR patches, x4, from
      the frozen Day 3 config -- 48 features, weight decay 0, augmentation on,
      seed 42 data / 1337 init. Every validation logs the blur diagnostic
      against fixed bicubic and ground-truth reference lines, so a spectral run
      buying consistency with blur is visible while it trains rather than
      afterwards. A2 and B1 are the deliverable; B2 is skipped if under 2.5x the
      median run duration remains.
    enable_gpu: true
    accelerator: NvidiaTeslaT4
    entry: scripts/day3_runs.py
    entry_args:
      # Read for seeds, paths and the supporting-file staging list. The TRAINING
      # decisions come from configs/frozen_day3.yaml, whose hash every run
      # records.
      - "--config"
      - "configs/base.yaml"
      # Outside the clone on purpose: prune_workdir() clears the clone at the
      # end of a successful session, and /kaggle/working is what Kaggle saves,
      # so checkpoints here survive and are fetchable.
      - "--runs-root"
      - "/kaggle/working/runs"
      - "--iters"
      - "12000"
      - "--ckpt-every"
      - "1000"
      - "--val-every"
      - "500"
      - "--wd"
      - "0.0"
      - "--spectral-downsample"
      - "area"
      # 8.0, not 9.0. Kaggle kills a GPU session at 9 hours and this script's
      # clock starts AFTER the clone, the pip installs and the data guard, and
      # ends BEFORE Kaggle's own output commit. The hour is those.
      - "--budget-hours"
      - "8.0"
      - "--a2-cut-hours"
      - "3.5"
      - "--b2-margin"
      - "2.5"
    # 9 hours: the session ceiling. The script's own budget stops it earlier.
    expected_runtime_min: 540
